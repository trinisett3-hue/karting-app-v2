name: Verification JS

# Verification minimale (audit 28/07, section 4.3 : "aucune integration continue").
# Ce repo est du HTML + modules ES natifs sans etape de build, donc pas de
# "build" a proprement parler -- mais chaque fichier .js doit au moins etre
# syntaxiquement valide avant de merger, ce qui n'etait verifie nulle part.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la syntaxe de tous les modules JS
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f"; then
              echo "::error file=$f::Erreur de syntaxe"
              status=1
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          exit $status

      - name: Aucun domaine applicatif ecrit en dur
        run: |
          # Ajoute le 03/08 avec la bascule vers trinisette.fr.
          #
          # Toute l'application repose sur une regle non ecrite jusqu'ici : le code
          # navigateur ne connait pas son propre domaine. APP_CONFIG.baseUrl vaut
          # window.location.origin, et chaque lien est soit construit a partir de la, soit
          # relatif. C'est ce qui permet de changer d'origine (.pages.dev ->
          # app.trinisette.fr, ou demain autre chose) sans toucher une seule ligne.
          #
          # Une regle non ecrite se perd. Il suffit d'un copier-coller d'URL depuis la
          # barre d'adresse pour figer l'application sur un domaine, et rien ne le
          # signale : ca marche parfaitement... jusqu'au jour du changement de domaine.
          # D'ou ce garde-fou. Voir docs/ARCHITECTURE-URL.md.
          #
          # Le nom d'hote du projet Supabase (config.js) n'est pas concerne : ce n'est pas
          # l'origine de l'application, et il est public par conception (cle anon).
          #
          # PERIMETRE : `karting-v2/src` (recursif) et les .html a la racine du depot.
          # `vitrine/` en est volontairement exclu, et cette exclusion n'est pas un oubli.
          # La vitrine est un site distinct, servi par un autre projet Pages sur un autre
          # domaine (trinisette.fr) ; le seul moyen pour elle de pointer vers l'application
          # est justement d'ecrire https://app.trinisette.fr en clair, puisque son
          # window.location.origin n'est pas celui de l'application. La regle « pas de
          # domaine en dur » protege la portabilite de l'application, pas celle d'un lien
          # sortant. Si la vitrine devait un jour vivre dans le meme projet Pages, cette
          # exclusion serait a reexaminer.
        # 2026-08-03 : trinisette.fr (sans sous-domaine) est le domaine de la
        # vitrine -- un lien sortant vers elle (ex. badge "Propulse par
        # TRINISETTE") n'est pas une origine applicative en dur, contrairement
        # a un sous-domaine comme app.trinisette.fr. On ne bloque donc que les
        # sous-domaines et pages.dev, pas le domaine racine trinisette.fr.
        if grep -rnE 'https?://[A-Za-z0-9.-]*pages\.dev|https?://[A-Za-z0-9-]+\.trinisette\.fr' \
               --include='*.js' --include='*.html' \
               karting-v2/src *.html; then
            echo "::error::Domaine applicatif ecrit en dur. Utiliser APP_CONFIG.baseUrl (= window.location.origin) ou une URL relative — cf. docs/ARCHITECTURE-URL.md"
            exit 1
          fi
          echo "OK : aucune origine applicative en dur."

      - name: Un seul sens par parametre d URL
        run: |
          # `v` est le jeton de circuit, lu par public-results.js et register.js.
          # Il a servi un temps de cache-buster dans results.js, ce qui creait deux
          # parametres homonymes dans le meme espace d'URL — collision reelle, masquee
          # seulement par l'ordre des tests. Le cache-buster s'appelle `_r` depuis le
          # 03/08 ; ce test empeche la regression.
          if grep -rn "'&v=' *+ *Date.now()\|\"&v=\" *+ *Date.now()" karting-v2/src; then
            echo "::error::Le parametre 'v' est reserve au jeton de circuit. Utiliser '_r' pour un cache-buster."
            exit 1
          fi
          echo "OK : pas de collision sur le parametre 'v'."
